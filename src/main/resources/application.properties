#Server Config#
server.servlet.context-path=/Bus-tracking
server.port=8081
### DATABASE ###
#spring.datasource.driver-class-name=com.mysql.jdbc.Driver

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation= true
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto= update

spring.datasource.url= ${DB_URL:jdbc:postgresql://localhost:5432/bus}
spring.datasource.username= ${DB_USERNAME:postgres}
spring.datasource.password= ${DB_PASSWORD:admin}
### JPA / HIBERNATE ###
# Desactiver en production : spring.jpa.show-sql=false
spring.jpa.show-sql=${SHOW_SQL:false}

#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
logging.level.org.springframework.web.servlet=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG

### JWT CONFIG ###
jwt.secret=${JWT_SECRET:busTrackingPFE2026SecretKeyXYZ!@#$%^&*()_+abcdefghij}
jwt.expiration.ms=${JWT_EXP_MS:900000}
jwt.refresh.expiration.ms=${JWT_REFRESH_MS:604800000}

### JACKSON – dates ISO 8601 (Instant, LocalDateTime) ###
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false